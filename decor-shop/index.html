<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SAPTHAGIRI PARTY SHOP</title>
<meta name="description" content="Decorations for birthdays, baby showers, Halloween, Christmas, Diwali, Dussehra and every festival.">
<meta name="theme-color" content="#7a1f5c">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎉</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fffaf3;
    --surface: #ffffff;
    --ink: #2a1a24;
    --muted: #7a6670;
    --line: #f0e3d6;
    --brand: #7a1f5c;
    --brand-ink: #ffffff;
    --accent: #f59e0b;
    --accent-soft: #fff1d6;
    --ok: #15803d;
    --danger: #b91c1c;
    --wa: #25d366;
    --radius: 16px;
    --shadow: 0 6px 24px rgba(74, 20, 54, .08);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  img { max-width: 100%; display: block; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: var(--brand); }
  h1, h2, h3 { font-family: Fraunces, Georgia, serif; line-height: 1.15; margin: 0; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px; }
  .hidden { display: none !important; }

  /* Announcement + header */
  .announce { background: var(--brand); color: var(--brand-ink); text-align: center; font-size: 14px; padding: 8px 16px; }
  header.top {
    position: sticky; top: 0; z-index: 20; background: rgba(255, 250, 243, .92);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
  }
  header.top .wrap { display: flex; align-items: center; gap: 12px; height: 60px; }
  .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); min-width: 0; flex: 1; }
  .logo img, .logo .mono { width: 38px; height: 38px; border-radius: 12px; object-fit: cover; flex: none; }
  .logo .mono { display: grid; place-items: center; background: linear-gradient(135deg, var(--brand), #c2417e); color: #fff; font: 700 15px/1 "DM Sans", sans-serif; letter-spacing: .5px; }
  .logo span {
    font-family: Fraunces, Georgia, serif; font-weight: 700; font-size: 20px; line-height: 1.1;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  @media (max-width: 480px) {
    .logo span { font-size: 16px; }
    .cart-btn .word { display: none; }
    .cart-btn { padding: 9px 12px; }
  }
  .cart-btn {
    position: relative; border: 0; background: var(--brand); color: var(--brand-ink);
    border-radius: 999px; padding: 9px 16px; display: flex; align-items: center; gap: 8px; font-weight: 700;
  }
  .cart-btn .count {
    background: var(--accent); color: var(--ink); border-radius: 999px; min-width: 22px; height: 22px;
    font-size: 13px; display: grid; place-items: center; padding: 0 6px;
  }

  /* Collections nav strip */
  .nav-strip { border-bottom: 1px solid var(--line); background: var(--bg); }
  .nav-strip .wrap { position: relative; display: flex; gap: 8px; overflow-x: auto; padding-top: 10px; padding-bottom: 10px; scrollbar-width: none; }
  .nav-strip .wrap::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; text-decoration: none; color: var(--ink); background: var(--surface); border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 14px; font-size: 14px; font-weight: 500; white-space: nowrap;
  }
  .chip.active { background: var(--ink); color: #fff; border-color: var(--ink); }

  /* Hero */
  .hero { padding: 36px 0 12px; }
  .hero h1 { font-size: clamp(30px, 7vw, 52px); }
  .hero p { color: var(--muted); font-size: 18px; max-width: 560px; margin: 12px 0 20px; }
  .hero .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn {
    border: 0; border-radius: 999px; padding: 12px 20px; font-weight: 700; text-decoration: none;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn.primary { background: var(--brand); color: var(--brand-ink); }
  .btn.wa { background: var(--wa); color: #06331a; }
  .btn.ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
  .btn.block { width: 100%; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  section { padding: 24px 0; }
  .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .section-head h2 { font-size: 26px; }
  .section-head p { margin: 4px 0 0; color: var(--muted); }

  /* Collection cards */
  .collections { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  @media (min-width: 700px) { .collections { grid-template-columns: repeat(4, 1fr); } }
  .collection-card {
    position: relative; aspect-ratio: 1 / 1; border-radius: var(--radius); overflow: hidden; text-decoration: none;
    color: #fff; box-shadow: var(--shadow); display: flex; align-items: flex-end;
  }
  .collection-card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .collection-card .emoji { position: absolute; top: 14px; left: 14px; font-size: 44px; line-height: 1; }
  .collection-card .label {
    position: relative; width: 100%; padding: 28px 14px 12px;
    background: linear-gradient(transparent, rgba(0, 0, 0, .55));
  }
  .collection-card .label strong { display: block; font-family: Fraunces, Georgia, serif; font-size: 20px; }
  .collection-card .label small { opacity: .9; }

  /* Search */
  .search { position: relative; margin-bottom: 14px; }
  .search input {
    width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
    padding: 12px 16px 12px 42px; font-size: 16px;
  }
  .search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); }

  /* Product cards */
  .products { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  @media (min-width: 700px) { .products { grid-template-columns: repeat(3, 1fr); gap: 16px; } }
  @media (min-width: 1000px) { .products { grid-template-columns: repeat(4, 1fr); } }
  .product {
    background: var(--surface); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow);
    display: flex; flex-direction: column; border: 1px solid var(--line);
  }
  .product .thumb { position: relative; aspect-ratio: 1 / 1; background: var(--accent-soft); border: 0; padding: 0; width: 100%; }
  .product .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .product .thumb .ph { position: absolute; inset: 0; display: grid; place-items: center; font-size: 56px; }
  .badge {
    position: absolute; top: 8px; left: 8px; background: var(--ink); color: #fff; font-size: 12px;
    border-radius: 999px; padding: 3px 10px; font-weight: 700;
  }
  .product .info { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .product h3 { font-family: "DM Sans", sans-serif; font-size: 15px; font-weight: 700; line-height: 1.3; }
  .product .price { font-weight: 700; color: var(--brand); }
  .product .add { margin-top: auto; }
  .price.muted { color: var(--muted); font-weight: 500; font-size: 14px; }

  /* Qty stepper */
  .qty { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--surface); }
  .qty button { border: 0; background: transparent; width: 40px; height: 40px; font-size: 20px; font-weight: 700; color: var(--brand); }
  .qty span { flex: 1; text-align: center; font-weight: 700; min-width: 28px; }
  .add .btn { padding: 10px 12px; font-size: 14px; }

  .empty { text-align: center; color: var(--muted); padding: 40px 16px; }
  .notice { background: var(--accent-soft); border: 1px dashed var(--accent); border-radius: 12px; padding: 12px 14px; font-size: 14px; margin: 16px 0 0; }

  /* Page title for a collection */
  .page-head { padding: 28px 0 8px; }
  .page-head .back { text-decoration: none; font-size: 14px; font-weight: 500; }
  .page-head h1 { font-size: clamp(28px, 6vw, 44px); margin-top: 8px; }
  .page-head p { color: var(--muted); margin: 8px 0 0; max-width: 600px; }
  .page-banner { margin-top: 16px; border-radius: var(--radius); overflow: hidden; aspect-ratio: 3 / 1; }
  .page-banner img { width: 100%; height: 100%; object-fit: cover; }

  /* Footer */
  footer { margin-top: 40px; padding: 32px 0 100px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
  footer h3 { color: var(--ink); font-size: 20px; margin-bottom: 8px; }
  footer p { margin: 4px 0; }

  /* Floating WhatsApp */
  .fab {
    position: fixed; right: 16px; bottom: 16px; z-index: 15; width: 56px; height: 56px; border-radius: 50%;
    background: var(--wa); display: grid; place-items: center; box-shadow: 0 8px 24px rgba(0, 0, 0, .2);
  }

  /* Sheets: product detail + cart */
  .overlay { position: fixed; inset: 0; background: rgba(30, 10, 25, .45); z-index: 30; }
  .sheet {
    position: fixed; z-index: 31; left: 0; right: 0; bottom: 0; max-height: 92vh; overflow-y: auto;
    background: var(--surface); border-radius: 20px 20px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
  }
  @media (min-width: 700px) {
    .sheet { left: 50%; right: auto; bottom: auto; top: 50%; transform: translate(-50%, -50%); width: 560px; border-radius: 20px; max-height: 88vh; }
  }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .sheet-head h2 { font-size: 22px; }
  .x { border: 0; background: var(--bg); width: 36px; height: 36px; border-radius: 50%; font-size: 20px; flex: none; }
  .gallery { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory; border-radius: 14px; }
  .gallery > * { flex: none; width: 100%; aspect-ratio: 1 / 1; scroll-snap-align: start; border-radius: 14px; object-fit: cover; background: var(--accent-soft); }
  .gallery .ph { display: grid; place-items: center; font-size: 90px; }
  .detail-desc { color: var(--muted); white-space: pre-line; }
  .detail-row { display: flex; gap: 10px; align-items: center; margin-top: 14px; }
  .detail-row .qty { flex: 0 0 140px; }
  .detail-row .btn { flex: 1; }

  .cart-line { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .cart-line .pic { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; background: var(--accent-soft); display: grid; place-items: center; font-size: 26px; }
  .cart-line .name { font-weight: 700; font-size: 15px; line-height: 1.3; }
  .cart-line .sub { color: var(--muted); font-size: 14px; }
  .cart-line .qty button { width: 32px; height: 32px; font-size: 18px; }
  .cart-line .remove { border: 0; background: none; color: var(--danger); font-size: 13px; padding: 0; }
  .total { display: flex; justify-content: space-between; font-weight: 700; font-size: 18px; padding: 14px 0; }

  form.checkout { display: grid; gap: 10px; margin-top: 6px; }
  form.checkout label { font-size: 14px; font-weight: 500; display: grid; gap: 4px; }
  form.checkout input, form.checkout textarea {
    width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; font-size: 16px; background: var(--bg);
  }
  form.checkout textarea { min-height: 70px; resize: vertical; }
  .error { color: var(--danger); font-size: 14px; }
  .success { text-align: center; padding: 10px 0; }
  .success .big { font-size: 56px; }
  .success pre { text-align: left; white-space: pre-wrap; background: var(--bg); border-radius: 12px; padding: 12px; font-size: 13px; }

  .loading { padding: 60px 0; text-align: center; color: var(--muted); }
  .spinner { width: 34px; height: 34px; border: 3px solid var(--line); border-top-color: var(--brand); border-radius: 50%; margin: 0 auto 12px; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast {
    position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); background: var(--ink); color: #fff;
    padding: 10px 18px; border-radius: 999px; font-size: 14px; z-index: 40; box-shadow: var(--shadow);
  }
</style>
</head>
<body>
  <div id="announce" class="announce hidden"></div>
  <header class="top">
    <div class="wrap">
      <a class="logo" href="#/"><img id="logoImg" class="hidden" alt=""><b id="mono" class="mono" aria-hidden="true"></b><span id="shopName">Decorations</span></a>
      <button class="cart-btn" id="cartBtn" aria-label="Open cart">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>
        <span class="word">Cart</span> <span class="count" id="cartCount">0</span>
      </button>
    </div>
  </header>
  <nav class="nav-strip"><div class="wrap" id="navStrip"></div></nav>

  <main class="wrap" id="app">
    <div class="loading"><div class="spinner"></div>Loading decorations…</div>
  </main>

  <footer><div class="wrap" id="footer"></div></footer>

  <a id="fab" class="fab hidden" target="_blank" rel="noopener" aria-label="Chat on WhatsApp">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="#fff"><path d="M17.5 14.4c-.3-.1-1.8-.9-2-1-.3-.1-.5-.1-.7.1-.2.3-.8 1-.9 1.2-.2.2-.3.2-.6.1-.3-.1-1.3-.5-2.4-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6l.4-.5c.2-.2.2-.3.3-.5.1-.2 0-.4 0-.5l-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.1.2 2.1 3.2 5.1 4.5.7.3 1.3.5 1.7.6.7.2 1.4.2 1.9.1.6-.1 1.8-.7 2-1.4.2-.7.2-1.3.2-1.4-.1-.2-.3-.3-.6-.4zM12 21.8c-1.8 0-3.5-.5-5-1.4l-.4-.2-3.7 1 1-3.6-.2-.4A9.8 9.8 0 1 1 12 21.8zm8.4-18.2A11.8 11.8 0 0 0 1.8 17.9L.1 24l6.3-1.6A11.8 11.8 0 0 0 12 23.8 11.8 11.8 0 0 0 20.4 3.6z"/></svg>
  </a>

  <div id="overlay" class="overlay hidden"></div>
  <div id="sheet" class="sheet hidden" role="dialog" aria-modal="true"></div>
  <div id="toast" class="toast hidden"></div>

<script src="config.js"></script>
<script>
(function () {

  // ---------- Sample data (shown until a Google Sheet is connected) ----------

    ],
    products: [

      { name: "Marigold Door Toran", collection: "Diwali, Dussehra", price: "349", description: "Artificial marigold and mango-leaf toran, 1 metre long." },

      { name: "Dussehra Puja Decor Set", collection: "Dussehra", price: "", description: "Customised to your mandir size — price on request." },
      { name: "Happy Birthday Balloon Kit", collection: "Birthday", price: "599", description: "Foil banner, 50 balloons, ribbons and pump." },
      { name: "Custom Name Cake Topper", collection: "Birthday", price: "249", description: "Tell us the name in the order notes." },
      { name: "Oh Baby Pastel Balloon Arch", collection: "Baby Shower", price: "1299", description: "Ready-to-assemble arch kit with 100 pastel balloons." },
      { name: "Godh Bharai Backdrop", collection: "Baby Shower", price: "", description: "Floral backdrop with name board. Price on request." }
    ]
  };

  var PALETTE = [
    ["#7a1f5c", "#c2417e"], ["#c2410c", "#f59e0b"], ["#14532d", "#16a34a"], ["#1e3a8a", "#6366f1"],
    ["#9d174d", "#f472b6"], ["#0f766e", "#2dd4bf"], ["#4c1d95", "#a855f7"], ["#7c2d12", "#ea580c"]
  ];

  // ---------- State ----------
  var S = { settings: {}, collections: [], products: [], byId: {}, cart: [], sample: false, query: "", page: null };
  var CART_KEY = "decor-cart-v1";

  // ---------- Helpers ----------
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function slug(s) { return String(s).toLowerCase().trim().replace(/&/g, "and").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "item"; }
  function key(s) { return String(s || "").toLowerCase().replace(/[^a-z0-9]/g, ""); }
  function yes(v, dflt) {
    v = String(v == null ? "" : v).trim().toLowerCase();
    if (!v) return dflt;
    return !/^(no|n|false|0|hide|hidden|out|out of stock|sold out)$/.test(v);
  }
  function money(n) { return "₹" + Number(n).toLocaleString("en-IN", { maximumFractionDigits: 2 }); }
  function parsePrice(v) {
    var n = parseFloat(String(v == null ? "" : v).replace(/[^0-9.]/g, ""));
    return isFinite(n) && n > 0 ? n : null;
  }
  function waNumber(v) {
    var d = String(v || "").replace(/\D/g, "");
    if (d.length === 10) d = "91" + d;
    if (d.length === 11 && d[0] === "0") d = "91" + d.slice(1);
    return d;
  }
  function toast(msg) {
    var t = $("toast"); t.textContent = msg; t.classList.remove("hidden");
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.add("hidden"); }, 1800);
  }

  // Turn Google Drive / Dropbox share links into direct image links.
  function imageUrl(u) {
    u = String(u || "").trim();
    if (!u) return "";
    var m = u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=|thumbnail\?id=)([\w-]{10,})/);
    if (m) return "https://drive.google.com/thumbnail?id=" + m[1] + "&sz=w1000";
    if (/dropbox\.com/.test(u)) return u.replace(/[?&]dl=0/, "").replace("www.dropbox.com", "dl.dropboxusercontent.com");
    return u;
  }
  function imageList(v) {
    return String(v || "").split(/[\s,]+/).map(imageUrl).filter(function (u) { return /^https?:\/\//.test(u); });
  }

  // Small CSV parser that understands quotes, commas and new lines inside cells.
  function parseCSV(text) {
    var rows = [], row = [], cell = "", q = false;
    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (q) {
        if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
        else cell += c;
      } else if (c === '"') q = true;
      else if (c === ",") { row.push(cell); cell = ""; }
      else if (c === "\n" || c === "\r") {
        if (c === "\r" && text[i + 1] === "\n") i++;
        row.push(cell); rows.push(row); row = []; cell = "";
      } else cell += c;
    }
    if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
    return rows.filter(function (r) { return r.some(function (c) { return String(c).trim() !== ""; }); });
  }
  function toObjects(rows) {
    if (!rows.length) return [];
    var head = rows[0].map(key);
    return rows.slice(1).map(function (r) {
      var o = {};
      head.forEach(function (h, i) { if (h) o[h] = String(r[i] == null ? "" : r[i]).trim(); });
      return o;
    });
  }
  function pick(o, names) {
    for (var i = 0; i < names.length; i++) if (o[names[i]] != null && o[names[i]] !== "") return o[names[i]];
    return "";
  }

  // ---------- Loading data from Google Sheets ----------
  function sheetId() {
    var p = new URLSearchParams(location.search).get("sheet");
    var raw = p || ((window.SHOP_CONFIG || {}).sheet) || "";
    var m = String(raw).match(/\/d\/([\w-]{20,})/);
    return m ? m[1] : String(raw).trim();
  }
  function fetchTab(id, name) {
    var url = "https://docs.google.com/spreadsheets/d/" + encodeURIComponent(id) +
      "/gviz/tq?tqx=out:csv&headers=1&sheet=" + encodeURIComponent(name) + "&t=" + Date.now();
    return fetch(url, { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error("Sheet tab '" + name + "' could not be loaded (" + r.status + ")");
      return r.text();
    }).then(function (t) {
      if (/^\s*</.test(t)) throw new Error("The Google Sheet is not shared publicly");
      return parseCSV(t);
    });
  }

  function loadData() {
    var id = sheetId();
    if (!id) { S.sample = true; return Promise.resolve(SAMPLE); }
    return Promise.all([
      fetchTab(id, "Settings").catch(function () { return []; }),
      fetchTab(id, "Collections").catch(function () { return []; }),
      fetchTab(id, "Products")
    ]).then(function (res) {
      // Google returns the first tab when a tab name is missing, so check the headers.
      var settingsRows = res[0], colRows = res[1], prodRows = res[2];
      var settings = {};
      if (settingsRows.length && /setting|key/i.test(settingsRows[0][0] || "")) {
        settingsRows.slice(1).forEach(function (r) { if (r[0]) settings[key(r[0])] = String(r[1] || "").trim(); });
      }
      var prodHead = (prodRows[0] || []).map(key);
      if (prodHead.indexOf("name") < 0 || !prodHead.some(function (h) { return /price|collection|category|festival/.test(h); })) {
        throw new Error("Couldn't find the Products tab. Check the tab is named exactly “Products”.");
      }
      var colHead = (colRows[0] || []).map(key);
      var collections = colHead.indexOf("name") >= 0 && colHead.indexOf("price") < 0 ? toObjects(colRows) : [];
      return { settings: settings, collections: collections, products: toObjects(prodRows) };
    });
  }

  function normalise(data) {
    var st = {};
    Object.keys(data.settings || {}).forEach(function (k) { st[key(k)] = data.settings[k]; });
    S.settings = {
      shopName: pick(st, ["shopname", "name", "storename"]) || "Decorations",
      tagline: pick(st, ["tagline", "about", "subtitle"]),
      whatsapp: waNumber(pick(st, ["whatsapp", "whatsappnumber", "whatsappno"])),
      email: pick(st, ["orderemail", "email", "gmail"]),
      phone: pick(st, ["phone", "phonenumber", "mobile", "contactnumber"]),
      address: pick(st, ["address", "location", "shopaddress"]),
      instagram: pick(st, ["instagram", "insta"]),
      announcement: pick(st, ["announcement", "offer", "banner"]),
      deliveryNote: pick(st, ["deliverynote", "ordernote", "note"]),
      logo: imageUrl(pick(st, ["logo", "logoimage"])),
      heroImage: imageUrl(pick(st, ["heroimage", "coverimage", "cover"]))
    };

    // Collections: listed ones first (in sheet order), then any new names used by products.
    var cols = [], colByKey = {};
    function addCol(c) {
      var k = key(c.name);
      if (!k || colByKey[k]) return colByKey[k];
      c.slug = slug(c.name); c.idx = cols.length; colByKey[k] = c; cols.push(c); return c;
    }
    (data.collections || []).forEach(function (c) {
      var name = pick(c, ["name", "collection", "festival", "page"]);
      if (!name) return;
      addCol({
        name: name, emoji: pick(c, ["emoji", "icon"]) || "🎉", image: imageUrl(pick(c, ["image", "photo", "banner", "picture"])),
        description: pick(c, ["description", "about", "details"]), show: yes(pick(c, ["show", "visible", "active"]), true)
      });
    });

    var used = {};
    S.products = [];
    S.byId = {};
    (data.products || []).forEach(function (p) {
      var name = pick(p, ["name", "product", "productname", "item", "title"]);
      if (!name || !yes(pick(p, ["show", "visible"]), true)) return;
      var colNames = String(pick(p, ["collection", "collections", "category", "festival", "page", "occasion"]) || "Other")
        .split(",").map(function (s) { return s.trim(); }).filter(Boolean);
      var pc = colNames.map(function (n) { return addCol({ name: n, emoji: "🎉", image: "", description: "", show: true }); });
      var base = slug(name), id = base, n = 2;
      while (used[id]) id = base + "-" + n++;
      used[id] = true;
      var prod = {
        id: id, name: name, cols: pc,
        price: parsePrice(pick(p, ["price", "rate", "mrp", "amount"])),
        images: imageList(pick(p, ["image", "images", "photo", "photos", "picture", "imagelink"])),
        description: pick(p, ["description", "details", "about", "info"]),
        available: yes(pick(p, ["available", "instock", "stock", "availability"]), true),
        tag: pick(p, ["tag", "label", "badge"])
      };
      S.products.push(prod); S.byId[id] = prod;
    });
    S.collections = cols.filter(function (c) { return c.show; });
  }

  // ---------- Cart ----------
  function loadCart() {
    try { S.cart = JSON.parse(localStorage.getItem(CART_KEY) || "[]") || []; } catch (e) { S.cart = []; }
    S.cart = S.cart.filter(function (l) { return S.byId[l.id] && S.byId[l.id].available && l.qty > 0; });
  }
  function saveCart() {
    try { localStorage.setItem(CART_KEY, JSON.stringify(S.cart)); } catch (e) {}
    var n = S.cart.reduce(function (a, l) { return a + l.qty; }, 0);
    $("cartCount").textContent = n;
  }
  function cartQty(id) { var l = S.cart.find(function (x) { return x.id === id; }); return l ? l.qty : 0; }
  function setQty(id, qty) {
    qty = Math.max(0, Math.min(999, qty | 0));
    var i = S.cart.findIndex(function (x) { return x.id === id; });
    if (qty === 0) { if (i >= 0) S.cart.splice(i, 1); }
    else if (i >= 0) S.cart[i].qty = qty;
    else S.cart.push({ id: id, qty: qty });
    saveCart();
  }
  function cartTotals() {
    var total = 0, onRequest = 0;
    S.cart.forEach(function (l) { var p = S.byId[l.id]; if (p.price) total += p.price * l.qty; else onRequest++; });
    return { total: total, onRequest: onRequest };
  }

  // ---------- Rendering ----------
  function gradient(i) { var c = PALETTE[i % PALETTE.length]; return "linear-gradient(135deg," + c[0] + "," + c[1] + ")"; }
  function phEmoji(p) { return (p.cols[0] && p.cols[0].emoji) || "🎉"; }

  function productCard(p) {
    var img = p.images[0];
    var q = cartQty(p.id);
    var action;
    if (!p.available) action = '<button class="btn ghost block" disabled>Out of stock</button>';
    else if (q > 0) action = '<div class="qty"><button data-dec="' + p.id + '" aria-label="Less">−</button><span>' + q + '</span><button data-inc="' + p.id + '" aria-label="More">+</button></div>';
    else action = '<button class="btn primary block" data-inc="' + p.id + '">Add to cart</button>';
    return '<article class="product">' +
      '<button class="thumb" data-open="' + p.id + '" aria-label="View ' + esc(p.name) + '">' +
        '<span class="ph">' + esc(phEmoji(p)) + '</span>' +
        (img ? '<img loading="lazy" src="' + esc(img) + '" alt="' + esc(p.name) + '" onerror="this.remove()">' : "") +
        (p.tag ? '<span class="badge">' + esc(p.tag) + '</span>' : !p.available ? '<span class="badge">Sold out</span>' : "") +
      '</button>' +
      '<div class="info"><h3>' + esc(p.name) + '</h3>' +
        (p.price ? '<div class="price">' + money(p.price) + '</div>' : '<div class="price muted">Price on request</div>') +
        '<div class="add">' + action + '</div>' +
      '</div></article>';
  }

  function productsGrid(list) {
    if (!list.length) return '<div class="empty">No products here yet — check back soon! 🎈</div>';
    return '<div class="products">' + list.map(productCard).join("") + '</div>';
  }

  function collectionCard(c) {
    var count = S.products.filter(function (p) { return p.cols.indexOf(c) >= 0; }).length;
    return '<a class="collection-card" href="#/c/' + c.slug + '" style="background:' + gradient(c.idx) + '">' +
      (c.image ? '<img loading="lazy" src="' + esc(c.image) + '" alt="" onerror="this.remove()">' : '<span class="emoji">' + esc(c.emoji) + '</span>') +
      '<span class="label"><strong>' + esc(c.name) + '</strong><small>' + count + (count === 1 ? " item" : " items") + '</small></span></a>';
  }

  function renderNav(active) {
    $("navStrip").innerHTML = '<a class="chip' + (!active ? " active" : "") + '" href="#/">All</a>' +
      S.collections.map(function (c) {
        return '<a class="chip' + (active === c ? " active" : "") + '" href="#/c/' + c.slug + '">' + esc(c.emoji) + " " + esc(c.name) + '</a>';
      }).join("");
    var strip = $("navStrip"), a = strip.querySelector(".active");
    if (a) strip.scrollLeft = a.offsetLeft - strip.clientWidth / 2 + a.offsetWidth / 2;
  }

  function searchBox() {
    return '<div class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>' +
      '<input id="q" type="search" placeholder="Search decorations…" value="' + esc(S.query) + '" autocomplete="off"></div>';
  }
  function filterProducts(list) {
    var q = S.query.trim().toLowerCase();
    if (!q) return list;
    return list.filter(function (p) {
      return (p.name + " " + p.description + " " + p.cols.map(function (c) { return c.name; }).join(" ")).toLowerCase().indexOf(q) >= 0;
    });
  }

  function renderHome() {
    var st = S.settings;
    renderNav(null);
    document.title = st.shopName;
    var html = '<div class="hero">' +
      (st.heroImage ? '<div class="page-banner" style="margin:0 0 20px"><img src="' + esc(st.heroImage) + '" alt=""></div>' : "") +
      '<h1>' + esc(st.shopName) + '</h1>' +
      (st.tagline ? '<p>' + esc(st.tagline) + '</p>' : '<p></p>') +
      '<div class="actions"><a class="btn primary" href="#collections">Shop by occasion</a>' +
      (st.whatsapp ? '<a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/' + st.whatsapp + '">Chat on WhatsApp</a>' : "") +
      '</div>' +
      (S.sample ? '<div class="notice">👋 You are looking at <b>sample products</b>. Connect your Google Sheet (see the setup guide) and your own products will appear here.</div>' : "") +
      '</div>';
    if (S.collections.length) {
      html += '<section id="collections"><div class="section-head"><div><h2>Shop by occasion</h2></div></div>' +
        '<div class="collections">' + S.collections.map(collectionCard).join("") + '</div></section>';
    }
    html += '<section><div class="section-head"><div><h2>All decorations</h2></div></div>' + searchBox() +
      '<div id="grid">' + productsGrid(pageProducts()) + '</div></section>';
    $("app").innerHTML = html;
  }

  function renderCollection(c) {
    renderNav(c);
    document.title = c.name + " · " + S.settings.shopName;
    $("app").innerHTML = '<div class="page-head"><a class="back" href="#/">← All occasions</a>' +
      '<h1>' + esc(c.emoji) + " " + esc(c.name) + '</h1>' +
      (c.description ? '<p>' + esc(c.description) + '</p>' : "") +
      (c.image ? '<div class="page-banner"><img src="' + esc(c.image) + '" alt="" onerror="this.parentNode.remove()"></div>' : "") +
      '</div><section><div id="grid">' + productsGrid(pageProducts()) + '</div></section>';
  }

  function renderFooter() {
    var st = S.settings;
    var bits = [];
    if (st.phone) bits.push('<p>📞 <a href="tel:' + esc(st.phone.replace(/[^\d+]/g, "")) + '">' + esc(st.phone) + '</a></p>');
    if (st.whatsapp) bits.push('<p>💬 <a target="_blank" rel="noopener" href="https://wa.me/' + st.whatsapp + '">WhatsApp us</a></p>');
    if (st.email) bits.push('<p>✉️ <a href="mailto:' + esc(st.email) + '">' + esc(st.email) + '</a></p>');
    if (st.instagram) {
      var ig = st.instagram.replace(/^@/, "");
      var igUrl = /^https?:/.test(ig) ? ig : "https://instagram.com/" + ig;
      bits.push('<p>📸 <a target="_blank" rel="noopener" href="' + esc(igUrl) + '">Instagram</a></p>');
    }
    if (st.address) bits.push('<p>📍 ' + esc(st.address) + '</p>');
    $("footer").innerHTML = '<h3>' + esc(st.shopName) + '</h3>' + bits.join("") +
      '<p style="margin-top:14px">© ' + new Date().getFullYear() + " " + esc(st.shopName) + '</p>';
  }

  // Products shown on the current page: one collection, or everything (filtered by search).
  function pageProducts() {
    var c = S.page;
    if (c) return S.products.filter(function (p) { return p.cols.indexOf(c) >= 0; });
    return filterProducts(S.products);
  }

  function route() {
    var h = location.hash || "#/";
    var m = h.match(/^#\/c\/([^/?]+)/);
    var c = m && S.collections.find(function (x) { return x.slug === decodeURIComponent(m[1]); });
    var toCollections = h === "#collections" && !S.page && $("collections");
    S.page = c || null;
    if (c) renderCollection(c);
    else if (!toCollections) renderHome();
    if (h === "#collections" && $("collections")) $("collections").scrollIntoView({ behavior: toCollections ? "smooth" : "auto" });
    else window.scrollTo(0, 0);
  }

  function refreshCards() {
    // Redraw the product cards only, so the page doesn't jump.
    var grid = $("grid");
    if (grid) grid.innerHTML = productsGrid(pageProducts());
  }

  // ---------- Bottom sheets ----------
  var sheetMode = null, detailQty = 1;
  function openSheet(html, mode) {
    sheetMode = mode;
    $("sheet").innerHTML = html;
    $("sheet").classList.remove("hidden"); $("overlay").classList.remove("hidden");
    $("sheet").scrollTop = 0;
    document.body.style.overflow = "hidden";
  }
  function closeSheet() {
    sheetMode = null;
    $("sheet").classList.add("hidden"); $("overlay").classList.add("hidden");
    document.body.style.overflow = "";
  }

  function openDetail(id) {
    var p = S.byId[id]; if (!p) return;
    detailQty = Math.max(1, cartQty(id) || 1);
    var gallery = p.images.length
      ? p.images.map(function (u) { return '<img src="' + esc(u) + '" alt="' + esc(p.name) + '">'; }).join("")
      : '<div class="ph">' + esc(phEmoji(p)) + '</div>';
    openSheet('<div class="sheet-head"><h2>' + esc(p.name) + '</h2><button class="x" data-close aria-label="Close">×</button></div>' +
      '<div class="gallery">' + gallery + '</div>' +
      (p.images.length > 1 ? '<p class="price muted" style="text-align:center;margin:6px 0 0">Swipe for more photos →</p>' : "") +
      '<p style="font-size:20px;font-weight:700;color:var(--brand);margin:14px 0 4px">' + (p.price ? money(p.price) : "Price on request") + '</p>' +
      (p.description ? '<p class="detail-desc">' + esc(p.description) + '</p>' : "") +
      '<p class="price muted">' + p.cols.map(function (c) { return esc(c.emoji + " " + c.name); }).join(" · ") + '</p>' +
      (p.available
        ? '<div class="detail-row"><div class="qty"><button data-dq="-1" aria-label="Less">−</button><span id="dq">' + detailQty + '</span><button data-dq="1" aria-label="More">+</button></div>' +
          '<button class="btn primary" data-addq="' + p.id + '">' + (cartQty(id) ? "Update cart" : "Add to cart") + '</button></div>'
        : '<button class="btn ghost block" disabled style="margin-top:14px">Out of stock</button>'), "detail");
  }

  function openCart() {
    if (!S.cart.length) {
      openSheet('<div class="sheet-head"><h2>Your cart</h2><button class="x" data-close aria-label="Close">×</button></div>' +
        '<div class="empty">Your cart is empty.<br><br><button class="btn primary" data-close>Browse decorations</button></div>', "cart");
      return;
    }
    var t = cartTotals();
    var lines = S.cart.map(function (l) {
      var p = S.byId[l.id], img = p.images[0];
      return '<div class="cart-line">' +
        (img ? '<img class="pic" src="' + esc(img) + '" alt="">' : '<div class="pic">' + esc(phEmoji(p)) + '</div>') +
        '<div><div class="name">' + esc(p.name) + '</div><div class="sub">' +
          (p.price ? money(p.price) + " × " + l.qty + " = <b>" + money(p.price * l.qty) + "</b>" : "Price on request × " + l.qty) +
        '</div><button class="remove" data-remove="' + p.id + '">Remove</button></div>' +
        '<div class="qty"><button data-dec="' + p.id + '" aria-label="Less">−</button><span>' + l.qty + '</span><button data-inc="' + p.id + '" aria-label="More">+</button></div>' +
        '</div>';
    }).join("");
    var draft = {};
    try { draft = JSON.parse(localStorage.getItem("decor-customer") || "{}") || {}; } catch (e) {}
    openSheet('<div class="sheet-head"><h2>Your cart</h2><button class="x" data-close aria-label="Close">×</button></div>' +
      lines +
      '<div class="total"><span>Total</span><span>' + money(t.total) + (t.onRequest ? ' <small class="price muted">+ ' + t.onRequest + ' on request</small>' : "") + '</span></div>' +
      '<form class="checkout" id="checkout" novalidate>' +
        '<h3 style="font-size:18px">Your details</h3>' +
        '<label>Name *<input name="name" required autocomplete="name" value="' + esc(draft.name) + '"></label>' +
        '<label>Phone / WhatsApp *<input name="phone" type="tel" required autocomplete="tel" inputmode="tel" value="' + esc(draft.phone) + '"></label>' +
        '<label>Delivery address / area *<textarea name="address" required autocomplete="street-address">' + esc(draft.address) + '</textarea></label>' +
        '<label>Needed by (date)<input name="date" type="date"></label>' +
        '<label>Notes (theme, colours, name on banner…)<textarea name="notes"></textarea></label>' +
        '<div class="error hidden" id="formErr"></div>' +
        '<button class="btn primary block" type="submit" id="placeBtn">Place order</button>' +
        (S.settings.deliveryNote ? '<p class="price muted" style="text-align:center;margin:0">' + esc(S.settings.deliveryNote) + '</p>' : "") +
      '</form>', "cart");
  }

  function orderId() {
    var d = new Date();
    return "ORD-" + String(d.getDate()).padStart(2, "0") + String(d.getMonth() + 1).padStart(2, "0") + "-" + Math.floor(1000 + Math.random() * 9000);
  }

  function buildOrder(f) {
    var t = cartTotals();
    var items = S.cart.map(function (l, i) {
      var p = S.byId[l.id];
      return (i + 1) + ". " + p.name + " × " + l.qty + (p.price ? " = " + money(p.price * l.qty) : " (price on request)");
    });
    var o = {
      id: orderId(), name: f.name, phone: f.phone, address: f.address, date: f.date, notes: f.notes,
      items: items.join("\n"),
      total: money(t.total) + (t.onRequest ? " + " + t.onRequest + " item(s) price on request" : "")
    };
    o.text = "🎉 *New order " + o.id + "*\n\n" + o.items + "\n\n*Total: " + o.total + "*\n\n" +
      "Name: " + o.name + "\nPhone: " + o.phone + "\nAddress: " + o.address +
      (o.date ? "\nNeeded by: " + o.date : "") + (o.notes ? "\nNotes: " + o.notes : "");
    return o;
  }

  function sendEmail(o) {
    var body = new URLSearchParams();
    body.append("_subject", "New order " + o.id + " from " + o.name + " (" + o.total + ")");
    body.append("_template", "table");
    body.append("_captcha", "false");
    body.append("Order ID", o.id);
    body.append("Customer name", o.name);
    body.append("Phone", o.phone);
    body.append("Address", o.address);
    if (o.date) body.append("Needed by", o.date);
    if (o.notes) body.append("Notes", o.notes);
    body.append("Items", o.items);
    body.append("Total", o.total);
    return fetch("https://formsubmit.co/ajax/" + encodeURIComponent(S.settings.email), {
      method: "POST", headers: { Accept: "application/json" }, body: body
    }).then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) {
      if (!r.ok || String(j.success) === "false") throw new Error(j.message || "Email failed");
      return true;
    }); });
  }

  function submitOrder(form) {
    var f = {};
    ["name", "phone", "address", "date", "notes"].forEach(function (k) { f[k] = (form.elements[k].value || "").trim(); });
    var err = $("formErr");
    var missing = [];
    if (!f.name) missing.push("name");
    if (f.phone.replace(/\D/g, "").length < 10) missing.push("a valid phone number");
    if (!f.address) missing.push("delivery address");
    if (missing.length) { err.textContent = "Please add your " + missing.join(", ") + "."; err.classList.remove("hidden"); return; }
    try { localStorage.setItem("decor-customer", JSON.stringify({ name: f.name, phone: f.phone, address: f.address })); } catch (e) {}

    var o = buildOrder(f);
    var st = S.settings;
    var waUrl = st.whatsapp ? "https://wa.me/" + st.whatsapp + "?text=" + encodeURIComponent(o.text) : "";

    if (!st.email && waUrl) {
      // No email set up: send straight to WhatsApp.
      finishOrder(o, { emailed: false, waUrl: waUrl });
      if (!window.open(waUrl, "_blank")) window.location.href = waUrl;
      return;
    }
    if (!st.email) { finishOrder(o, { emailed: false, waUrl: "" }); return; }

    var btn = $("placeBtn"); btn.disabled = true; btn.textContent = "Sending order…";
    sendEmail(o).then(function () { finishOrder(o, { emailed: true, waUrl: waUrl }); })
      .catch(function () { finishOrder(o, { emailed: false, waUrl: waUrl, failed: true }); });
  }

  function finishOrder(o, r) {
    S.cart = []; saveCart(); refreshCards();
    var st = S.settings, msg;
    if (r.emailed) msg = "We've received your order and will contact you shortly to confirm.";
    else if (r.waUrl) msg = "Tap the button below to send your order to us on WhatsApp.";
    else msg = "Please send the order details below to us" + (st.phone ? " at " + esc(st.phone) : "") + ".";
    openSheet('<div class="sheet-head"><h2>Thank you!</h2><button class="x" data-close aria-label="Close">×</button></div>' +
      '<div class="success"><div class="big">🎉</div><p><b>Order ' + esc(o.id) + '</b><br>' + msg + '</p>' +
      (r.waUrl ? '<a class="btn wa block" href="' + esc(r.waUrl) + '" target="_blank" rel="noopener">' + (r.emailed ? "Also confirm on WhatsApp" : "Send order on WhatsApp") + '</a>' : "") +
      '<details style="margin-top:14px;text-align:left"><summary>Order details</summary><pre>' + esc(o.text.replace(/\*/g, "")) + '</pre></details>' +
      '<button class="btn ghost block" data-close style="margin-top:10px">Continue shopping</button></div>', "done");
  }

  // ---------- Events ----------
  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-inc],[data-dec],[data-open],[data-close],[data-remove],[data-dq],[data-addq]");
    if (!t) return;
    var d = t.dataset;
    if (d.inc) {
      var was = cartQty(d.inc); setQty(d.inc, was + 1);
      if (!was) toast("Added to cart 🛒");
      sheetMode === "cart" ? openCart() : refreshCards();
    } else if (d.dec) {
      setQty(d.dec, cartQty(d.dec) - 1);
      sheetMode === "cart" ? openCart() : refreshCards();
    } else if (d.remove) {
      setQty(d.remove, 0); openCart(); refreshCards();
    } else if (d.open) {
      openDetail(d.open);
    } else if (d.dq) {
      detailQty = Math.max(1, Math.min(999, detailQty + Number(d.dq))); $("dq").textContent = detailQty;
    } else if (d.addq) {
      setQty(d.addq, detailQty); closeSheet(); refreshCards(); toast("Cart updated 🛒");
    } else if (d.close !== undefined) {
      closeSheet();
    }
  });
  $("overlay").addEventListener("click", closeSheet);
  $("cartBtn").addEventListener("click", openCart);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeSheet(); });
  document.addEventListener("submit", function (e) {
    if (e.target.id === "checkout") { e.preventDefault(); submitOrder(e.target); }
  });
  document.addEventListener("input", function (e) {
    if (e.target.id === "q") { S.query = e.target.value; refreshCards(); }
  });
  window.addEventListener("hashchange", function () { closeSheet(); route(); });

  // ---------- Start ----------
  loadData().then(function (data) {
    normalise(data);
    var st = S.settings;
    $("shopName").textContent = st.shopName;
    $("mono").textContent = st.shopName.split(/\s+/).filter(function (w) { return /^[a-z]/i.test(w); }).slice(0, 2).map(function (w) { return w[0].toUpperCase(); }).join("");
    if (st.logo) { $("logoImg").src = st.logo; $("logoImg").classList.remove("hidden"); $("mono").classList.add("hidden"); }
    if (st.announcement) { $("announce").textContent = st.announcement; $("announce").classList.remove("hidden"); }
    if (st.whatsapp) { $("fab").href = "https://wa.me/" + st.whatsapp; $("fab").classList.remove("hidden"); }
    loadCart(); saveCart(); renderFooter(); route();
  }).catch(function (err) {
    $("app").innerHTML = '<div class="empty"><div style="font-size:48px">😕</div><p><b>We couldn\'t load the products right now.</b><br>Please refresh the page in a moment.</p>' +
      '<p class="price muted" style="font-size:13px">' + esc(err.message) + '</p><button class="btn primary" onclick="location.reload()">Refresh</button></div>';
  });
})();
</script>
</body>
</html>
