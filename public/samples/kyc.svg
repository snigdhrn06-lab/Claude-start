<svg xmlns="http://www.w3.org/2000/svg" width="390" height="878" viewBox="0 0 390 878" font-family="Helvetica, Arial, sans-serif">
<metadata>Synthetic Sentinel demo screenshot — fictional data.</metadata>
<rect width="390" height="878" fill="#0b0d10"/>
<rect width="390" height="72" fill="#14171c"/>
<circle cx="36" cy="38" r="16" fill="#2a2f38"/>
<text x="31" y="43" font-size="14" fill="#c9ced6" class="ui">S</text>
<text x="62" y="34" font-size="15" fill="#f1f3f5" font-weight="600" class="ui">SecureBank Alerts</text>
<text x="62" y="52" font-size="11" fill="#7d8592" class="ui">SMS → WhatsApp call</text>
<g class="msg" data-sender="SecureBank Alerts">
<rect x="16" y="96" width="275.6" height="88" rx="12" fill="#1d2026"/>
<text x="28" y="118" font-size="13" fill="#e9edf1">Dear Customer, your SecureBank KYC</text>
<text x="28" y="136" font-size="13" fill="#e9edf1">is pending as per RBI guidelines.</text>
<text x="28" y="154" font-size="13" fill="#e9edf1">Update before 6:00 PM today to</text>
<text x="28" y="172" font-size="13" fill="#e9edf1">avoid service interruption.</text>
</g>
<g class="msg" data-sender="You">
<rect x="128" y="194" width="246" height="52" rx="12" fill="#1f6f5c"/>
<text x="140" y="216" font-size="13" fill="#e9edf1">I updated my KYC last year. Is</text>
<text x="140" y="234" font-size="13" fill="#e9edf1">this genuine?</text>
</g>
<g class="msg" data-sender="SecureBank KYC Desk">
<rect x="16" y="256" width="253.4" height="106" rx="12" fill="#1d2026"/>
<text x="28" y="278" font-size="13" fill="#e9edf1">Good afternoon, this is Rohit</text>
<text x="28" y="296" font-size="13" fill="#e9edf1">Verma from the SecureBank KYC</text>
<text x="28" y="314" font-size="13" fill="#e9edf1">Verification Cell. Our system</text>
<text x="28" y="332" font-size="13" fill="#e9edf1">shows your Aadhaar–PAN linking</text>
<text x="28" y="350" font-size="13" fill="#e9edf1">failed during the re-KYC cycle.</text>
</g>
<g class="msg" data-sender="SecureBank KYC Desk">
<rect x="16" y="372" width="275.6" height="88" rx="12" fill="#1d2026"/>
<text x="28" y="394" font-size="13" fill="#e9edf1">Your account will be frozen within</text>
<text x="28" y="412" font-size="13" fill="#e9edf1">30 minutes if verification is not</text>
<text x="28" y="430" font-size="13" fill="#e9edf1">completed. All UPI and card</text>
<text x="28" y="448" font-size="13" fill="#e9edf1">transactions will be blocked.</text>
</g>
<g class="msg" data-sender="You">
<rect x="150.2" y="470" width="223.8" height="52" rx="12" fill="#1f6f5c"/>
<text x="162.2" y="492" font-size="13" fill="#e9edf1">Can I just visit the branch</text>
<text x="162.2" y="510" font-size="13" fill="#e9edf1">tomorrow?</text>
</g>
<g class="msg" data-sender="SecureBank KYC Desk">
<rect x="16" y="532" width="275.6" height="106" rx="12" fill="#1d2026"/>
<text x="28" y="554" font-size="13" fill="#e9edf1">Branch verification takes 7</text>
<text x="28" y="572" font-size="13" fill="#e9edf1">working days, your account will be</text>
<text x="28" y="590" font-size="13" fill="#e9edf1">frozen by then. Online</text>
<text x="28" y="608" font-size="13" fill="#e9edf1">verification needs a refundable</text>
<text x="28" y="626" font-size="13" fill="#e9edf1">security deposit.</text>
</g>
<g class="msg" data-sender="SecureBank KYC Desk">
<rect x="16" y="648" width="275.6" height="70" rx="12" fill="#1d2026"/>
<text x="28" y="670" font-size="13" fill="#e9edf1">Transfer ₹18,500 immediately to</text>
<text x="28" y="688" font-size="13" fill="#e9edf1">verify-kyc@upi. The amount will be</text>
<text x="28" y="706" font-size="13" fill="#e9edf1">credited back within 2 hours.</text>
</g>
<g class="msg" data-sender="SecureBank KYC Desk">
<rect x="16" y="728" width="268.20000000000005" height="70" rx="12" fill="#1d2026"/>
<text x="28" y="750" font-size="13" fill="#e9edf1">Please do not disconnect or</text>
<text x="28" y="768" font-size="13" fill="#e9edf1">discuss this with anyone, it will</text>
<text x="28" y="786" font-size="13" fill="#e9edf1">delay the process.</text>
</g>
<rect y="824" width="390" height="54" fill="#14171c"/>
<rect x="14" y="836" width="362" height="30" rx="15" fill="#22262d"/>
<text x="30" y="856" font-size="12" fill="#6b7280" class="ui">Message</text>
</svg>