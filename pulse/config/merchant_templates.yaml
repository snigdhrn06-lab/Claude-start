# Merchant-level variation around the template (design parameters)
variation:
  hour_jitter_sigma: 0.20      # multiplicative noise on each hour weight
  day_noise_shape: 25          # gamma shape for day-to-day volume noise (smaller = noisier)
  honest_quirks:               # hard negatives among honest merchants (share of background merchants)
    late_hours: 0.05           # starts opening 2-3 h later from a random day (own-past drift only)
    step_up: 0.05              # volume x1.4-1.8 from a random day (new branch / delivery app)
    bulk_order: 0.05           # one day with a handful of large round catering payments
    growth: 0.10               # +1% a week organic growth
  honest_new_share: 0.10       # honest merchants onboarded mid-window (scored against their declared profile)
  honest_new_day_range: [60, 150]
