# Category templates for simulated merchants. ALL values are design parameters.
# hour_profile: relative payment intensity by hour of day (0..23). "from_bread_basket" means the
#   profile is computed from the real Bread Basket data at build time.
# dow: relative intensity Monday..Sunday.
# daily_tx_median / daily_tx_sigma: log-normal across merchants (size).
# bill_median / bill_sigma: log-normal bill size in INR within a merchant.
# round_rate: probability a payment is a round multiple of 100 (natural rounding, e.g. kirana top-ups).
# refund_rate: share of payments refunded later (genuine refunds: same payer, same or lower amount).
# festival_categories: which festival multipliers apply (see data/events/festivals.csv).
# match_multiplier: demand multiplier inside live-match windows (sports bars are busy on match nights).
categories:
  bakery:
    count: 40
    hour_profile: from_bread_basket
    dow: [0.85, 0.85, 0.9, 0.9, 1.0, 1.35, 1.25]
    daily_tx_median: 60
    daily_tx_sigma: 0.45
    bill_median: 220
    bill_sigma: 0.55
    round_rate: 0.04
    refund_rate: 0.0
    local_payers_per_daily_tx: 7
    walk_in_share: 0.08
    festival: true
    match_multiplier: 1.0
