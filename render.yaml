# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: sentinel
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # Optional: enables Claude for signal extraction and photo OCR.
      # Leave unset to run fully on the local engine.
      - key: ANTHROPIC_API_KEY
        sync: false
