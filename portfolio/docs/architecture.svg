<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" style="background:#fff" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
  <rect x="20" y="20" width="200" height="70" rx="10" fill="#f3f7e6" stroke="#6b8f1a"/>
  <text x="120" y="50" text-anchor="middle" font-weight="bold">Visitor's browser</text>
  <text x="120" y="70" text-anchor="middle">public pages, contact form</text>
  <rect x="20" y="130" width="200" height="70" rx="10" fill="#eef4fb" stroke="#3b6ea5"/>
  <text x="120" y="160" text-anchor="middle" font-weight="bold">Admin's browser</text>
  <text x="120" y="180" text-anchor="middle">/admin CMS (signed in)</text>
  <rect x="300" y="20" width="330" height="300" rx="12" fill="#fafafa" stroke="#333"/>
  <text x="465" y="45" text-anchor="middle" font-weight="bold">Next.js app (one Render web service)</text>
  <rect x="320" y="60" width="290" height="44" rx="6" fill="#fff" stroke="#999"/>
  <text x="465" y="80" text-anchor="middle">middleware.ts: security headers + CSP nonce</text>
  <text x="465" y="96" text-anchor="middle" fill="#666">every request</text>
  <rect x="320" y="115" width="140" height="80" rx="6" fill="#f3f7e6" stroke="#6b8f1a"/>
  <text x="390" y="140" text-anchor="middle">Public pages</text>
  <text x="390" y="158" text-anchor="middle" fill="#666">app/(site)/…</text>
  <text x="390" y="176" text-anchor="middle" fill="#666">queries.ts (published)</text>
  <rect x="470" y="115" width="140" height="80" rx="6" fill="#eef4fb" stroke="#3b6ea5"/>
  <text x="540" y="140" text-anchor="middle">Admin pages + API</text>
  <text x="540" y="158" text-anchor="middle" fill="#666">app/admin, app/api/admin</text>
  <text x="540" y="176" text-anchor="middle" fill="#666">guard.ts → repo.ts</text>
  <rect x="320" y="205" width="290" height="44" rx="6" fill="#fff" stroke="#999"/>
  <text x="465" y="225" text-anchor="middle">lib/content (schemas, registry, repo, settings)</text>
  <text x="465" y="241" text-anchor="middle" fill="#666">validation + data access</text>
  <rect x="320" y="258" width="290" height="44" rx="6" fill="#fff" stroke="#999"/>
  <text x="465" y="278" text-anchor="middle">lib/media.ts + lib/storage/* (sharp → WebP)</text>
  <text x="465" y="294" text-anchor="middle" fill="#666">served at /media/…</text>
  <rect x="700" y="60" width="180" height="120" rx="12" fill="#fff6e8" stroke="#b5781c"/>
  <text x="790" y="90" text-anchor="middle" font-weight="bold">PostgreSQL</text>
  <text x="790" y="112" text-anchor="middle">content tables</text>
  <text x="790" y="130" text-anchor="middle">sessions, rate limits</text>
  <text x="790" y="148" text-anchor="middle">media_blobs (files)*</text>
  <rect x="700" y="230" width="180" height="70" rx="12" fill="#f4f4f4" stroke="#888" stroke-dasharray="5 4"/>
  <text x="790" y="258" text-anchor="middle">S3 / Cloudflare R2</text>
  <text x="790" y="276" text-anchor="middle" fill="#666">optional storage</text>
  <rect x="700" y="340" width="180" height="60" rx="12" fill="#f4f4f4" stroke="#888" stroke-dasharray="5 4"/>
  <text x="790" y="366" text-anchor="middle">Resend (email)</text>
  <text x="790" y="384" text-anchor="middle" fill="#666">optional</text>
  <line x1="220" y1="55" x2="298" y2="80" stroke="#333" marker-end="url(#a)"/>
  <line x1="220" y1="165" x2="298" y2="150" stroke="#333" marker-end="url(#a)"/>
  <line x1="630" y1="150" x2="698" y2="125" stroke="#333" marker-end="url(#a)"/>
  <line x1="630" y1="280" x2="698" y2="265" stroke="#888" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <line x1="630" y1="300" x2="698" y2="365" stroke="#888" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="20" y="420" fill="#666">* With STORAGE_DRIVER=database (default), uploaded files live in Postgres. With s3, they live in the bucket.</text>
</svg>
