<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SAPTHAGIRI ENTERPRISES – Party & Festival Decorations</title>
<meta name="description" content="Party and festival decorations, children's costumes, Christmas trees, Halloween products and festive items at the best prices. Order online for delivery or pickup.">
<meta name="theme-color" content="#8b1e6b">
<meta property="og:title" content="SAPTHAGIRI ENTERPRISES">
<meta property="og:description" content="You bring the guests, we bring the party! Decorations for every festival and celebration.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎉</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="announce" class="announce hidden"><div class="announce-track"><span id="announceText"></span></div></div>

  <header class="top">
    <div class="wrap top-row">
      <a class="logo" href="#/" aria-label="Home">
        <span class="logo-badge" id="logoBadge">SE</span>
        <span class="logo-text"><b id="shopName">SAPTHAGIRI ENTERPRISES</b><small id="shopTag">Party & festival decorations</small></span>
      </a>
      <div class="top-actions">
        <button class="icon-btn" id="searchBtn" aria-label="Search">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        </button>
        <button class="icon-btn" id="accountBtn" aria-label="My account">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
          <i class="dot hidden" id="accountDot"></i>
        </button>
        <button class="cart-btn" id="cartBtn" aria-label="Open cart">
          <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l-1 13H7L6 7Z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>
          <span class="count" id="cartCount">0</span>
        </button>
      </div>
    </div>
  </header>

  <main id="app">
    <div class="loading"><div class="spinner"></div><p>Getting the party ready…</p></div>
  </main>

  <footer class="footer" id="footer"></footer>

  <a id="fab" class="fab hidden" target="_blank" rel="noopener" aria-label="Chat on WhatsApp">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="#fff"><path d="M17.5 14.4c-.3-.1-1.8-.9-2-1-.3-.1-.5-.1-.7.1-.2.3-.8 1-.9 1.2-.2.2-.3.2-.6.1-.3-.1-1.3-.5-2.4-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6l.4-.5c.2-.2.2-.3.3-.5.1-.2 0-.4 0-.5l-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.1.2 2.1 3.2 5.1 4.5.7.3 1.3.5 1.7.6.7.2 1.4.2 1.9.1.6-.1 1.8-.7 2-1.4.2-.7.2-1.3.2-1.4-.1-.2-.3-.3-.6-.4zM12 21.8c-1.8 0-3.5-.5-5-1.4l-.4-.2-3.7 1 1-3.6-.2-.4A9.8 9.8 0 1 1 12 21.8zm8.4-18.2A11.8 11.8 0 0 0 1.8 17.9L.1 24l6.3-1.6A11.8 11.8 0 0 0 12 23.8 11.8 11.8 0 0 0 20.4 3.6z"/></svg>
  </a>

  <div id="overlay" class="overlay hidden"></div>
  <div id="sheet" class="sheet hidden" role="dialog" aria-modal="true"></div>
  <div id="gate" class="gate hidden"></div>
  <div id="toast" class="toast hidden" role="status"></div>

  <script src="/app.js"></script>
</body>
</html>
